# value_qa skill 的 keyword 池：5001 条样本实际使用的主题词子集。
#
# 结构：keywords → 二级维度 → 场景类别 → [主题词列表]（与 value_qa_keywords.yaml 一致）
#
# 母本：configs/value_qa_keywords.yaml（435 词 / 41 场景）
# 来源：data/samples/value_qa/value_qa_gpt55_balanced_5001_20260724.jsonl（5001 条 / 1667 组）
# 本文件：178 词，占母本 40.9%
#
# 说明：仅剔除未产出样本的主题词；未使用的场景类别（文化元素符合度/饮食文化）已整块移除。
# 可直接替换母本用于复现或增量扩产。

version: v3-used5001
